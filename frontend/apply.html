<!DOCTYPE html>
<html>
<head>
  <title>Apply Job</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      margin: 0;
      padding: 0;
    }

    .container {
      width: 100%;
      max-width: 450px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    input, textarea {
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #4a90e2;
      box-shadow: 0 0 5px rgba(74,144,226,0.3);
    }

    textarea {
      resize: none;
      height: 100px;
    }

    button {
      padding: 12px;
      background: #000;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.3s;
    }

    button:hover {
      background: #333;
    }
  </style>

</head>

<body>

  <div class="container">

    <h1>Apply For Job</h1>

    <form id="applyForm">

      <input type="text" id="jobId" placeholder="Job ID" required>

      <input type="text" id="name" placeholder="Your Name" required>

      <input type="email" id="email" placeholder="Email" required>

      <input type="text" id="resumeLink" placeholder="Resume Link" required>

      <textarea id="coverLetter" placeholder="Cover Letter"></textarea>

      <button type="submit">Apply</button>

    </form>

  </div>

  <script>
    const form = document.getElementById('applyForm');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const data = {
        jobId: document.getElementById('jobId').value,
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        resumeLink: document.getElementById('resumeLink').value,
        coverLetter: document.getElementById('coverLetter').value
      };

      const response = await fetch(
        'http://localhost:5000/api/applications',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        }
      );

      const result = await response.json();

      alert(result.message || 'Application Submitted');
    });
  </script>

</body>
</html>
